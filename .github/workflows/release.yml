name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    name: Build and publish the plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the plugin's version
        run: sh bin/check-version.sh "$GITHUB_REF_NAME"

      - name: Build the zip
        run: sh bin/zip.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" socommerce-for-woocommerce.zip --title "$GITHUB_REF_NAME" --generate-notes
