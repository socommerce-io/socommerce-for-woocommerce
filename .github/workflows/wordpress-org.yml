name: WordPress.org

# Publishes a tagged release to the plugin's WordPress.org SVN repository. Its own workflow,
# apart from the GitHub release, so it can be run by hand on an existing tag without publishing
# the GitHub release twice. When and how to switch it on: README.md, "Releasing".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  svn:
    name: Publish to the WordPress.org directory
    runs-on: ubuntu-latest
    # Job-level, not step-level: `secrets` cannot be read in a step's `if`, `env` can.
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - name: Only a tag is published
        if: github.ref_type != 'tag'
        run: |
          echo "Run this workflow from a tag (vX.Y.Z), not a branch"
          exit 1

      - uses: actions/checkout@v4

      - name: The tag names the plugin's version
        run: sh bin/check-version.sh "$GITHUB_REF_NAME"

      - name: No SVN credentials yet
        if: env.SVN_USERNAME == '' || env.SVN_PASSWORD == ''
        run: echo "::notice::SVN_USERNAME and SVN_PASSWORD are not set, so nothing was published to WordPress.org"

      - name: Publish to SVN
        if: env.SVN_USERNAME != '' && env.SVN_PASSWORD != ''
        # 10up/action-wordpress-plugin-deploy 2.3.0. It ships what .gitattributes does not
        # mark export-ignore, the same tree as the release zip.
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SLUG: socommerce-for-woocommerce
